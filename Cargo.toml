[package]
name = "rpi-led-panel"
version = "0.9.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0"
authors = ["Sven Niederberger <s-niederberger@outlook.com>"]
description = "Control LED matrices with a Raspberry Pi."
repository = "https://github.com/EmbersArc/rpi_led_panel"
homepage = "https://github.com/EmbersArc/rpi_led_panel"
readme = "README.md"
keywords = ["led", "matrix", "raspberry", "pi", "rgb"]

[[example]]
name = "image"
required-features = ["drawing"]

[[example]]
name = "drawing"
required-features = ["drawing"]

[[example]]
name = "rotating_square"

[features]
default = ["drawing"]
drawing = ["embedded-graphics"]
# Use the GPIO pins above 31 of the Compute Module, for up to 6 parallel chains. Doubles the memory per canvas.
wide-gpio = []

[dependencies]
argh = "0.1.19"
memmap2 = "0.9.12"
embedded-graphics = { version = "0.8.2", optional = true }
thread-priority = "3.1.1"
libc = "0.2.191"
strum = { version = "0.28.0", features = ["derive"] }
log = "0.4.34"

[dev-dependencies]
env_logger = "0.11.11"
